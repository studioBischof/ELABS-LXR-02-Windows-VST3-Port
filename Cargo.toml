[package]
name = "elabs_lxr"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "LXR V2 drum engine (Erica Synths firmware, GPL-3.0) as a VST3 instrument"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
base64 = "0.22"
libloading = "0.8"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = { version = "0.15", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
strip = "symbols"

[features]
# `cargo run --release --features preview --bin lxr_preview` opens the plugin as a standalone app
preview = ["nih_plug/standalone"]

[[bin]]
name = "lxr_preview"
path = "src/bin/preview.rs"
required-features = ["preview"]

# nih_plug_egui with EguiState::set_requested_size() public (size presets); see vendor/README.md
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug_egui = { path = "vendor/nih_plug_egui" }
# egui-baseview with the keyboard focus taken on every mouse press (see the comment in
# vendor/egui-baseview/src/window.rs): Bitwig does not hand a parented editor window the keyboard.
# baseview with a control character that carries its key (see vendor/baseview/src/win/keyboard.rs):
# a WM_CHAR 0x08 that arrives without a matching key down became Unidentified, so Backspace from
# our own keyboard hook did nothing in Ableton
[patch."https://github.com/RustAudio/baseview"]
baseview = { path = "vendor/baseview" }

[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }
