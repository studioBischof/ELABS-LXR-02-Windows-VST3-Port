[package]
name = "elabs_lxr"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "LXR V2 drum engine (Erica Synths firmware, GPL-3.0) as a VST3 instrument"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
base64 = "0.22"
libloading = "0.8"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = { version = "0.15", default-features = false }

# Keyboard input on Windows: baseview never calls SetFocus when the plugin window is clicked, so a
# parented editor (in a DAW) gets mouse events but no WM_CHAR and text fields stay dead. egui-baseview
# has an upstream workaround for exactly that (issue #20): it asks baseview for the focus whenever egui
# reports an IME area, which is what a focused TextEdit does. Same git revision as nih_plug_egui uses,
# so Cargo unifies it with that one and only the feature is added.
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0", default-features = false, features = ["windows_keyboard_workaround"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
strip = "symbols"

[features]
# `cargo run --release --features preview --bin lxr_preview` opens the plugin as a standalone app
preview = ["nih_plug/standalone"]

[[bin]]
name = "lxr_preview"
path = "src/bin/preview.rs"
required-features = ["preview"]

# nih_plug_egui with EguiState::set_requested_size() public (size presets); see vendor/README.md
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug_egui = { path = "vendor/nih_plug_egui" }
